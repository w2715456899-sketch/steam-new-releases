name: Update Steam new releases

on:
  schedule:
    - cron: "0 * * * *"  # every hour, on the hour (UTC)
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read  # needed to look up recent run conclusions for the failure-streak check below

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write config.json from secrets
        run: |
          cat > config.json <<CONFIGEOF
          {
            "webhook_url": "${{ secrets.DISCORD_WEBHOOK_URL }}",
            "steam_api_key": "${{ secrets.STEAM_API_KEY }}",
            "language": "tchinese",
            "country": "tw",
            "retention_days": 30,
            "backfill_days": 30,
            "site_url": "https://w2715456899-sketch.github.io/steam-new-releases/",
            "git_auto_push": false
          }
          CONFIGEOF

      # 06:00 Taipei (UTC+8) = 22:00 UTC the previous day - only that hourly run actually
      # pings Discord, so friends get one summary a day instead of an hourly ping. Every
      # other run still refreshes history.json/docs/ silently.
      - name: Decide whether this is the once-a-day notify run
        id: when
        run: |
          if [ "$(date -u +%H)" = "22" ]; then
            echo "notify=1" >> "$GITHUB_OUTPUT"
          else
            echo "notify=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Run update (notify)
        if: steps.when.outputs.notify == '1'
        run: python steam_new_releases.py --no-backfill

      - name: Run update (silent)
        if: steps.when.outputs.notify == '0'
        run: python steam_new_releases.py --no-backfill --skip-notify

      - name: Commit and push data + site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs history.json
          git diff --cached --quiet || git commit -m "Update site $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      # The next hourly trigger is already a natural retry, and steam_api_get() now retries
      # transient failures within a run too - so a single failed run is usually a passing
      # blip, not worth paging anyone about. Only worth pinging once it's a real, ongoing
      # problem: count how many completed runs in a row (right before this one) also failed,
      # and only alert once this run makes three straight.
      - name: Check consecutive failure streak
        if: failure()
        id: streak
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONCLUSIONS=$(gh run list --repo "${{ github.repository }}" --workflow=update.yml \
            --limit 5 --json conclusion --jq '.[].conclusion' 2>/dev/null) || CONCLUSIONS=""
          if [ -z "$CONCLUSIONS" ]; then
            STREAK=3  # couldn't check the history - fail safe and alert anyway
          else
            STREAK=1
            for c in $CONCLUSIONS; do
              if [ "$c" = "failure" ]; then
                STREAK=$((STREAK + 1))
              else
                break
              fi
            done
          fi
          echo "streak=$STREAK" >> "$GITHUB_OUTPUT"

      - name: Alert on failure
        if: failure() && fromJSON(steps.streak.outputs.streak) >= 3
        run: |
          MSG="⚠️ Steam 新遊戲更新連續失敗 ${{ steps.streak.outputs.streak }} 次（$(TZ='Asia/Taipei' date +'%Y-%m-%d %H:%M') 台北時間）
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(jq -n --arg content "$MSG" '{content: $content}')
          curl -sf -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "${{ secrets.DISCORD_WEBHOOK_URL }}"
